<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10분 인생</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/neodgm/neodgm-webfont@1.600/neodgm/style.css" rel="stylesheet">
<style>
:root{
  --w:min(100vw, max(320px, calc((100dvh - 270px) * 16 / 9)), 1100px);
  --bg:#0e0b1c;--panel:#1c1736;--panel2:#2b2452;--ink:#fff6e0;--dim:#b3a9d6;
  --acc:#ffd84a;--acc2:#c79a00;--bad:#ff5a6e;--good:#6ff09a;--warn:#ffd84a;--line:#4a4180;--bc:#08050f;
  --edge:.2em 0 0 0 var(--bc),-.2em 0 0 0 var(--bc),0 .2em 0 0 var(--bc),0 -.2em 0 0 var(--bc);
  --edge2:.12em 0 0 0 var(--bc),-.12em 0 0 0 var(--bc),0 .12em 0 0 var(--bc),0 -.12em 0 0 var(--bc);
  --drop:0 .45em 0 0 rgba(0,0,0,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'NeoDunggeunmo','Galmuri11','Noto Sans KR',system-ui,monospace;font-weight:400}
.lead,#card p,#end .real,#end .tip,#card .dl,#card .mo{font-family:'Noto Sans KR',system-ui,sans-serif;font-weight:500}
b,strong{font-weight:700}
#card h2,#end h2,.btn,#hud .chip,.st,.bdg,.verdict{font-weight:400}
body{display:flex;justify-content:center;min-height:100dvh}
#app{width:var(--w);display:flex;flex-direction:column;font-size:clamp(12px,calc(var(--w) / 52),20px)}
.px{font-family:'Press Start 2P','Galmuri11',monospace}
#stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#000;border-bottom:.3em solid #000}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#stage.shake{animation:shake .35s steps(6)}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1.2%,.8%)}40%{transform:translate(1.2%,-.8%)}60%{transform:translate(-.8%,-.6%)}80%{transform:translate(.8%,.6%)}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:var(--bad);transition:opacity .25s}
#flash.on{opacity:.35;transition:none}
#flash.gd{background:var(--good)}
#hud{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;align-items:flex-start;gap:.5em;padding:.7em .8em;pointer-events:none}
#hud .chip{background:#150f2ef5;box-shadow:var(--edge),var(--drop);margin:.2em;padding:.55em .7em;line-height:1;display:flex;align-items:center;gap:.55em;font-size:.95em;color:var(--ink)}
#money{color:var(--acc)}#money.debt{color:var(--bad)}
#hud .sp{flex:1}
.ib{pointer-events:auto;cursor:pointer;font-family:inherit;font-size:.95em;color:var(--ink);background:#150f2ef5;border:0;margin:.2em;padding:.55em .7em;line-height:1;box-shadow:var(--edge),var(--drop)}
.ib:active{transform:translateY(.2em)}
.ico{width:1.15em;height:1.15em;flex:none}
@keyframes blink{50%{opacity:.35}}
#cap{position:absolute;left:50%;top:14%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-weight:700;font-size:2em;color:#fff;text-shadow:.1em .1em 0 #000,-.1em 0 0 #000,.1em 0 0 #000,0 -.1em 0 #000,0 .1em 0 #000;opacity:0;transition:opacity .4s;pointer-events:none}
#cap.on{opacity:1}
#cap small{display:block;text-align:center;font-size:.42em;letter-spacing:.2em;color:var(--acc);margin-top:.5em}
#title{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#title.on{display:flex}
#title h1{margin:0;font-family:'Galmuri14','Galmuri11',monospace;font-weight:700;font-size:5.2em;line-height:1;color:var(--acc);text-shadow:.07em .07em 0 #d6336c,.14em .14em 0 #000;letter-spacing:.02em}
#title h1 b{color:#fff}
#title p{margin:1.2em 0 0;font-size:.8em;color:#fff;background:#000b;padding:.5em .9em;letter-spacing:.1em}
#toast{display:none}
#pausev{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;font-size:2em;color:var(--acc)}
#pausev.on{display:flex}
#panel{flex:1;background:var(--panel);box-shadow:inset 0 .3em 0 var(--bc);padding:1.1em 1.1em 1.3em;display:flex;flex-direction:column;gap:.7em;min-height:250px}
.center{align-items:center;justify-content:center;text-align:center}
.lead{font-size:1.15em;line-height:1.6;color:var(--ink);margin:0}
.hint{font-size:.9em;color:var(--dim);margin:0}
.btn{font-family:inherit;font-size:max(14px,1.1em);color:#1b1130;background:var(--acc);border:0;margin:.2em;padding:.7em 1em;cursor:pointer;line-height:1.25;min-height:48px;
  box-shadow:var(--edge),inset 0 .2em 0 rgba(255,255,255,.45),inset 0 -.3em 0 rgba(0,0,0,.25),var(--drop)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(.2em);box-shadow:var(--edge),inset 0 .2em 0 rgba(255,255,255,.2),inset 0 -.1em 0 rgba(0,0,0,.25)}
.btn.big{font-size:max(20px,1.7em);padding:.6em 2.2em}
.btn.alt{background:#8ee3ff}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn small{display:block;font-size:.65em;opacity:.75;margin-top:.25em}
.row{display:flex;gap:.8em;flex-wrap:wrap;justify-content:center}
.row .btn{flex:1 1 9em}
#status{display:flex;flex-direction:column;gap:.55em}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em}
.st{background:var(--panel2);box-shadow:var(--edge2);padding:.45em .55em;display:flex;flex-direction:column;gap:.3em;margin:.12em}
.st .sl{display:flex;align-items:center;gap:.4em;font-size:.78em;color:var(--dim);white-space:nowrap}
.st .sv{font-size:1.02em;white-space:nowrap}
.st.good .sv{color:var(--good)}.st.warn .sv{color:var(--warn)}.st.bad .sv{color:var(--bad);animation:blink .7s steps(2) infinite}
#badges{display:flex;flex-wrap:wrap;gap:.45em}
.bdg{font-size:.78em;padding:.3em .6em;background:var(--panel2);box-shadow:var(--edge2);color:var(--dim);margin:.12em}
.bdg.ok{background:#14492d;color:#9dffbc}.bdg.no{background:#531528;color:#ffa9b6}.bdg.wr{background:#554308;color:var(--acc)}
#card{background:var(--panel2);box-shadow:var(--edge),var(--drop),inset 0 .2em 0 rgba(255,255,255,.07);margin:.2em;padding:.9em 1em 1em;display:flex;flex-direction:column;gap:.65em;animation:pop .12s steps(3)}
@keyframes pop{from{transform:translateY(.3em);opacity:.4}}
button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#card h2{margin:0;font-size:1.3em;font-weight:700;color:var(--acc)}
#card p{margin:0;font-size:1.05em;line-height:1.55}
#cbar{height:.55em;background:#08050f;margin:.1em}
#cbar b{display:block;height:100%;background:var(--acc);width:100%}
#cbar.low b{background:var(--bad)}
#opts{display:flex;gap:.7em;flex-wrap:wrap}
#opts .btn{flex:1 1 30%;font-size:max(14px,1em);padding:.7em .6em}
.wait{color:var(--dim);text-align:center;padding:1.2em 0}
kbd{display:none}
#opts .btn.opt{background:#1a1536;color:var(--ink);display:flex;align-items:center;gap:.7em;text-align:left;box-shadow:var(--edge),inset 0 .2em 0 rgba(255,255,255,.08),inset 0 -.25em 0 rgba(0,0,0,.4),var(--drop)}
#opts .btn.opt:hover{background:var(--acc);color:#1b1130}
#opts .btn.opt:hover kbd{background:#1b1130;color:var(--acc)}
#opts .btn.go{background:var(--acc);justify-content:center}
#card .slow{color:#ffb86b;font-size:.9em}
#card.res h2{color:var(--ink);font-size:1.05em}
#card.bad{box-shadow:var(--edge),0 0 0 .4em var(--bad),var(--drop)}
#card .dl{font-size:.98em}
#card .plus{color:var(--good)}#card .minus{color:#ff7a88}
#card .mo{font-size:.95em;color:#d6cff0;border-top:.15em dashed var(--line);padding-top:.55em}
#end{display:flex;flex-direction:column;gap:.7em;align-items:center;text-align:center}
#end h2{margin:0;font-size:1.9em;font-weight:700;color:var(--acc)}
#end h2.bad{color:var(--bad)}
.stay{display:flex;gap:1em;align-items:center;justify-content:center;flex-wrap:wrap}
.stay .mo{font-size:1.15em}.stay .mo b{color:var(--acc);font-size:1.5em}
.verdict{padding:.35em .8em;box-shadow:var(--edge2);font-size:1.1em;margin:.12em}
.verdict.good{background:#14492d;color:var(--good)}.verdict.warn{background:#554308;color:var(--acc)}.verdict.bad{background:#531528;color:var(--bad)}
#end .real{background:#000;padding:.7em .9em;font-size:1em;line-height:1.6;text-align:left}
#end .tip{background:#14492d;padding:.7em .9em;font-size:1em;line-height:1.6;text-align:left}
#end .fin{font-size:.9em;color:var(--dim);margin:0}
#reqs,#badges{display:flex;flex-wrap:wrap;gap:.35em;align-items:center}
#helpv{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#0b0918ee;padding:1em}
#helpv.on{display:flex}
#helpv .brief{width:min(94vw,1180px);max-height:92dvh;overflow:auto;background:var(--panel);box-shadow:var(--edge);padding:1em 1.2em}
.brief{display:flex;flex-direction:column;gap:.8em;align-items:center;text-align:center}
.brief h2{margin:0;color:var(--acc);font-size:1.5em;font-weight:400}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6em;width:100%;text-align:left}
.bbox{background:transparent;padding:.2em .3em}
.bbox h3{margin:0 0 .55em;font-size:1.2em;color:var(--acc);font-weight:400}
.bbox.bad h3{color:var(--bad)}
.bbox ul{margin:0;padding:0;list-style:none;font-family:'Noto Sans KR',sans-serif;font-size:1.02em;line-height:1.5;display:flex;flex-direction:column;gap:.6em;color:#e6e1ff}
.bbox b{color:#fff}
@media (max-width:1100px){.bgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.bgrid{grid-template-columns:1fr}}
.rqt{font-size:.78em;color:var(--acc);margin-right:.2em}
.rq{font-size:.75em;padding:.25em .5em;background:#3a1a28;color:#ffb0bc;box-shadow:var(--edge2);margin:.12em}
.rq.ok{background:#14492d;color:#9dffbc}
#panel #status{background:transparent;box-shadow:none;padding:0;margin:0;gap:.6em}
#stats,#badges{background:#120d28f8;box-shadow:var(--edge),var(--drop);padding:.55em .65em;margin:.2em}
#reqs{padding:.6em .7em .55em;margin:.2em;background:#2a2108f5;box-shadow:inset 0 0 0 2px #ffd84a,var(--edge),var(--drop)}
.st .sv small{font-size:.6em;color:var(--dim);margin-left:.15em}
html{word-break:keep-all;overflow-wrap:break-word}
.lead,.hint,#card p,#end p,.brief h2,#title p{text-wrap:balance}
.st .sv .bar{display:block;height:.32em;margin-top:.3em;background:#0b0818;box-shadow:0 0 0 1px #000}
.st .sv .bar b{display:block;height:100%;background:currentColor}
#panel #badges .bdg{font-size:.95em;padding:.35em .7em}
#panel #reqs .rq{font-size:.92em;padding:.32em .6em}
#panel #badges .rqt{font-size:1em}
#panel #reqs .rqt{font-size:1.12em}
#panel .st .sl{font-size:1em}
#panel .st .sv{font-size:1.3em}
#panel .st .sv small{font-size:.62em}
#panel #badges .bdg{font-size:1.02em}
#panel #reqs .rq{font-size:1em}
#panel #opts .btn.opt{font-size:clamp(16px,2.45vh,22px)}
#hud .chip{font-size:1.12em;padding:.6em .8em}
@media (max-height:800px) and (min-width:900px){
  #panel.ingame{top:3.6em;gap:.4em;font-size:.86em}
  #panel #status{gap:.35em}
  #stats,#badges{padding:.4em .55em}
  #reqs{padding:.45em .6em .4em}
  #card{padding:.7em .9em .8em;gap:.5em}
  #opts .btn{padding-top:.55em;padding-bottom:.55em}
}
#reqs .rqt{flex-basis:100%;font-size:.95em;color:#ffd84a;margin:0 0 .2em;text-shadow:2px 2px 0 #1d1620}
#card .tipl{font-size:.9em;color:#cfeeff;background:#12324a;padding:.5em .65em;line-height:1.5;box-shadow:var(--edge2);margin:.12em}
#end .learn{background:#12324a;padding:.7em .9em;text-align:left;font-family:'Noto Sans KR',sans-serif;font-size:.95em;line-height:1.55;width:100%}
#end .learn b{font-family:'NeoDunggeunmo',monospace;color:#8ee3ff;font-weight:400}
#end .learn ul{margin:.4em 0 0;padding-left:1.2em}
.how{display:flex;gap:.5em;flex-wrap:wrap;justify-content:center}
.how span{background:var(--panel2);box-shadow:var(--edge2);padding:.35em .6em;font-size:.85em;margin:.12em}
.ends{display:flex;gap:.35em;flex-wrap:wrap;justify-content:center}
.ends span{font-size:.72em;padding:.25em .5em;background:#14102a;color:#5a5480;box-shadow:var(--edge2);margin:.12em}
.ends span.on{color:var(--acc);background:#2b2452}
.album{width:100%;background:#120d28;box-shadow:var(--edge2);padding:.7em .8em;margin:.12em}
.album b{color:var(--acc);font-weight:400}
.pols{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;margin-top:.6em}
.pol{background:#f6f1e4;padding:.35em .35em .5em;box-shadow:0 .3em 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:.3em}
.pol img{width:100%;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated;display:block}
.pol span{color:#1d1620;font-size:.72em;text-align:center;font-family:'Noto Sans KR',sans-serif;line-height:1.3}
.goldbox{display:flex;flex-direction:column;align-items:center;gap:.5em;background:#3a2c08;color:var(--acc);box-shadow:var(--edge2);padding:.6em 1em;margin:.12em;font-size:1.05em}
@media (min-aspect-ratio:1/1){
  body{overflow:hidden}
  #app{width:100vw;height:100dvh;font-size:clamp(13px,min(1.38vw,2.05vh),24px)}
  #stage{position:fixed;inset:0;aspect-ratio:auto;border:0}
  #cv{object-fit:cover;object-position:50% 100%}
  #hud{padding:1em 1.2em;gap:.5em}
  #panel{position:fixed;z-index:5;min-height:0;background:transparent;box-shadow:none;padding:0;right:2.2vw;top:53%;transform:translateY(-50%);width:min(39vw,680px);max-height:84dvh;overflow:auto;gap:.8em}
  #panel.center{width:min(34vw,560px);background:#0e0b1cf0;box-shadow:var(--edge),var(--drop);padding:1.3em 1.4em 1.5em}
  #panel.endp{width:min(46vw,720px);background:#1c1736f8;box-shadow:var(--edge),var(--drop);padding:1.1em 1.3em}
  #panel.ingame{inset:auto;left:auto;right:2.4vw;top:4.4em;bottom:2.5dvh;transform:none;width:min(40vw,660px);max-height:none;overflow:visible;pointer-events:none;background:transparent;display:flex;flex-direction:column;gap:.7em}
  #panel.ingame>*{pointer-events:auto}
  #status{background:#120d28f8;box-shadow:var(--edge),var(--drop);padding:.6em .75em;gap:.45em;margin:.2em}
  #slot{min-height:0}
  #panel.brief{left:50%;right:auto;top:50%;transform:translate(-50%,-50%);width:min(92vw,1400px);max-height:92dvh;overflow:auto}
  #card{padding:1em 1.1em 1.1em;gap:.75em}
  #card p{line-height:1.6}
  #opts{flex-direction:column}
  #opts .btn{flex:1 1 auto}
  kbd{display:inline-block;font-family:'Press Start 2P',monospace;font-size:.6em;background:var(--acc);color:#1b1130;padding:.5em .55em;margin-right:.2em;flex:none}
  .wait{display:none}
  #title{align-items:flex-start;padding-left:9vw}
  #cap{left:30%;top:31%}
}
@media (max-width:640px){
  #stats{grid-template-columns:repeat(3,1fr)}
  #opts{flex-direction:column}
  #opts .btn{flex:1 1 auto}
  #title h1{font-size:4.4em}
}

#panel.brief{inset:0;transform:none;width:auto;max-height:none;height:100dvh;background:#0e0b1c;box-shadow:none;padding:3vh 4vw;display:flex;align-items:center;justify-content:center;overflow:auto}
#panel.brief .brief,#helpv .brief{max-width:1400px;width:100%;gap:1.4em}
#helpv{background:#0e0b1c}
#helpv .brief{background:transparent;box-shadow:none;width:min(94vw,1400px);max-height:96dvh}
.brief h2{font-size:1.9em}
.how{display:flex;flex-wrap:wrap;gap:.6em 1.6em;justify-content:center;align-items:center;font-size:1.15em}
.how span{display:flex;align-items:center;gap:.5em}
.how b{display:inline-grid;place-items:center;width:1.6em;height:1.6em;background:var(--acc);color:#1b1130;font-weight:400}
.how .dim{color:var(--dim)}
.bbox h3{font-size:1.3em}
.bbox ul{font-size:1.12em;line-height:1.55;color:#f2efff}
.brief .hint{font-size:1em;color:#b9b2e0}
#panel.center{background:#0e0b1c}
#panel.center .hint{font-size:1em;color:#cfc8f5}
.ends span{font-size:.9em;color:#8a83b8}
#panel.ingame{width:min(44vw,740px);font-size:clamp(14px,1.95vh,18px)}
#panel.ingame .st .sl,#panel.ingame #badges .bdg,#panel.ingame #reqs .rq,#panel.ingame #badges .rqt,#panel.ingame #reqs .rqt,#panel.ingame #card p,#panel.ingame .slow{font-size:1em}
#panel.ingame .st .sv{font-size:1.15em}
#panel.ingame #card h2{font-size:1.2em}
#panel.ingame #opts .btn.opt{font-size:clamp(18px,3.1vh,29px)}
#panel.ingame #opts .btn.go{font-size:clamp(16px,2.4vh,22px)}
#hud .chip{font-size:clamp(14px,1.95vh,18px)}

.brief .how,.brief .bgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.2em 2.4em;width:100%;max-width:1320px;margin:0 auto}
.brief .how span{display:flex;align-items:center;gap:.6em;background:#1c1638;box-shadow:var(--edge2);padding:.55em .75em;font-size:.95em;white-space:nowrap}
.brief .how i{font-style:normal;display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;background:var(--acc);color:#1b1130;flex:none}
.brief .bbox{padding:0}
.brief .bbox h3{font-size:1.25em;margin:0 0 .8em;padding-bottom:.5em;border-bottom:2px solid #3a3266}
.brief .bbox ul{gap:.9em;font-size:1.05em}
.brief .bbox li{display:flex;flex-direction:column;gap:.15em}
.brief .bbox li b{color:#fff}
.brief .bbox li span{color:#cfc9ef}
.brief .bbox.bad h3{color:var(--bad)}
.brief .hint{font-family:'Noto Sans KR',sans-serif;font-size:.95em}
@media (max-width:1100px){.brief .how,.brief .bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.brief .how,.brief .bgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="320" height="180"></canvas>
    <div id="flash"></div>
    <div id="title"><h1><b>10분</b> 인생</h1><p class="px">LIFE IN 10 MINUTES</p></div>
    <div id="cap"></div>
    <div id="toast"></div>
    <div id="pausev" class="px">PAUSE</div>
    <div id="hud">
      <div id="clk" class="chip" hidden></div>
      <div id="money" class="chip" hidden></div>
      <div class="sp"></div>
      <button id="bHelp" class="ib px" hidden aria-label="도움말">?</button>
      <button id="bPause" class="ib px" hidden aria-label="일시정지">II</button>
      <button id="bMute" class="ib" aria-label="소리">🔊</button>
      <button id="bFull" class="ib" aria-label="전체 화면">⛶</button>
    </div>
  </div>
  <div id="panel"></div>
  <div id="helpv"></div>
</div>

<script>
'use strict';
const START_MONEY=1000000;
const DEPORT_DEBT=-500000;
const GAME=600;
const CARD_TIME=20;
const AUTO_NEXT=9;
const TARGET_WIN=0.65;

function advClock(S,o){const h=S.hour,night=h>=20||h<5,a=o.act;
  if(o.time)addHours(S,((TIMES[o.time]-h+24)%24)||24);

    if(a.pose=='walk'){const sp=a.fast?7:4;o.f=NOW*(a.fast?16:10);x+=Math.sin(NOW*sp)*18;o.dir=Math.cos(NOW*sp)>0?1:-1}
    if(a.npc){o.dir=-1;person(sx-36,FEET,{outfit:a.npc,dir:1,emo:(a.npc=='boss'||a.npc=='drunk')?'angry':a.npc=='friend'?'happy':'ok',big:a.npc=='boss',bald:a.npc=='boss',tint:(a.npc=='boss'||a.npc=='drunk')?'red':'ok',pose:a.np||(a.npc=='friend'?'jump':'stand'),long:a.npc=='friend',hair:a.npc=='friend'?'#7a4a1c':'#1c1c22'})}}
  person(x,y,o);
  if(phase=='act')actFg(x,y,o);
  if(wet&&o.pose!='lie'&&o.pose!='sit')umbrella(x,y);
  if(loc=='street'){const sxx=((NOW*95)%760)-90;if(sxx<W+40)scooter(sxx,FEET+19)}
  if(wet)rain(NOW);if(snowy)snow(NOW);
  drawParts();
  if(fadeT>0){fadeT-=DT;R(0,0,W,H,'rgba(0,0,0,'+Math.min(1,fadeT*2.2)+')')}}
function shotGame(s,arg){
  if(s=='ending'){S.t=(arg=='success'||arg=='survived'||arg=='illegal')?GAME:+(Q.get('t')||300);S.end=arg;S.why=Q.get('why')||'';endGame(arg)}
  else{S.t=+(Q.get('t')||0);if(Q.get('job'))S.job=Q.get('job');if(Q.get('mood'))S.mood=+Q.get('mood');if(Q.get('money'))S.money=+Q.get('money');
    if(Q.get('ev'))S.later.push({id:Q.get('ev'),at:0});if(Q.get('hour'))S.hour=+Q.get('hour');if(Q.get('weather'))S.weather=Q.get('weather');hud()}}
window.__sim=n=>{const r=simulate(n||2000,polRandom);console.table(r);return r};
window.__simSmart=n=>{const r=simulate(n||2000,polSmart);console.table(r);return r};
let AC=null,muted=false,MG=null,SG=null,curSong=null,mStep=0,mNext=0,lastPick=-9;
function audioOn(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}
    if(AC){SG=AC.createGain();SG.gain.value=1;SG.connect(AC.destination);MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);setInterval(musicTick,40)}}
  if(AC&&AC.state=='suspended')AC.resume()}
function tone(f,t0,d,type,v,f2,dest){const o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);
  gn.gain.setValueAtTime(.0001,t0);gn.gain.linearRampToValueAtTime(v||.06,t0+.008);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(dest||SG);o.start(t0);o.stop(t0+d+.03)}
function noise(t0,d,v,f1,f2,dest,type){const n=Math.max(1,AC.sampleRate*d|0),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;
  const sr=AC.createBufferSource();sr.buffer=b;const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f1,t0);fl.frequency.exponentialRampToValueAtTime(f2||f1,t0+d);
  const gn=AC.createGain();gn.gain.setValueAtTime(v,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);sr.connect(fl);fl.connect(gn);gn.connect(dest||SG);sr.start(t0)}
const SFX={

 picnic:t=>[659,784,880,784].forEach((f,i)=>tone(f,t+i*.1,.1,'triangle',.05)),
 photo:t=>{noise(t,.05,.2,4000);noise(t+.07,.04,.15,2000)},
 phone:t=>{tone(1318,t,.08,'sine',.07);tone(1760,t+.1,.12,'sine',.07)},
 cry:t=>tone(440,t,.6,'triangle',.06,330),
 scold:t=>{for(let i=0;i<3;i++)tone(110,t+i*.13,.1,'sawtooth',.08)},

 run:t=>{for(let i=0;i<6;i++)noise(t+i*.09,.03,.06,1100,700)},
 sick:t=>{noise(t,.12,.12,700,400);noise(t+.25,.12,.1,700,400)},
 fever:t=>{noise(t,.12,.12,700,400);noise(t+.25,.12,.1,700,400)},
 panic:t=>{for(let i=0;i<4;i++)tone(880,t+i*.1,.05,'square',.04)},
 caught:t=>tone(600,t,1.2,'square',.04,900),
 happy:t=>[659,784,1047].forEach((f,i)=>tone(f,t+i*.08,.12,'square',.05)),
 gaming:t=>{tone(440,t,.05,'square',.04,880);tone(660,t+.12,.05,'square',.04,1320);noise(t+.24,.1,.05,2000)},
 earn:t=>[784,988,1175,1568].forEach((f,i)=>tone(f,t+i*.06,.1,'square',.05)),
 chime:t=>{tone(1318,t,.25,'sine',.06);tone(1046,t+.22,.35,'sine',.06)},
 subway:t=>[659,784,988,784,659].forEach((f,i)=>tone(f,t+i*.12,.12,'triangle',.05)),
 door:t=>noise(t,.08,.06,500,300),
 scratch:t=>{noise(t,.4,.3,3200,180);tone(900,t,.4,'sawtooth',.07,90);noise(t+.45,.25,.2,6000,2500)},
 fight:t=>{for(let i=0;i<3;i++){noise(t+i*.2,.09,.22,300,120);tone(90,t+i*.2,.08,'square',.06)}}};
function sfx(k){if(!AC||muted||!SFX[k])return;SFX[k](AC.currentTime+.01)}
function sfxLoc(l){sfx(l=='store'||l=='cafe'||l=='mcd'||l=='laundry'?'chime':l=='subway'||l=='bus'?'subway':'door')}
let stepT=0;function stepSfx(dt){stepT-=dt;if(stepT<=0){stepT=.18;sfx('step')}}
const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nf(n){const m=/^([A-G]#?)(\d)$/.exec(n);return 440*Math.pow(2,(NOTE[m[1]]+(m[2]-4)*12-9)/12)}
const pat=x=>x.trim().split(/\s+/).filter(t=>t!='|').map(t=>t=='.'?null:t);
const SONGS={
 title:{bpm:100,vol:1,lead:pat('E5 . G5 . A5 . G5 . | E5 . D5 . C5 . D5 . | E5 . G5 . A5 . C6 . | B5 . A5 . G5 . . .'),bass:pat('C3 . . . C3 . . . | A2 . . . A2 . . . | F2 . . . F2 . . . | G2 . . . G2 . . .')},
 day:{bpm:120,vol:.9,hat:1,lead:pat('C5 E5 G5 E5 C6 . G5 . | A5 . G5 E5 D5 . . . | F5 A5 C6 A5 G5 . E5 . | D5 E5 F5 D5 C5 . . .'),bass:pat('C3 . G2 . C3 . G2 . | A2 . E2 . A2 . E2 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . B2 .')},
 night:{bpm:80,vol:.8,lead:pat('A4 . C5 . E5 . . . | D5 . C5 . A4 . . . | F4 . A4 . C5 . . . | E5 . D5 . B4 . . .'),bass:pat('A2 . . . . . . . | D3 . . . . . . . | F2 . . . . . . . | E2 . . . . . . .')},
 party:{bpm:132,vol:.9,hat:1,kick:1,lead:pat('E5 E5 . E5 G5 . E5 . | D5 D5 . D5 F5 . D5 . | C5 C5 . C5 E5 . C5 . | D5 . E5 . G5 . A5 .'),bass:pat('A2 . A3 . A2 . A3 . | G2 . G3 . G2 . G3 . | F2 . F3 . F2 . F3 . | G2 . G3 . G2 . G3 .')},
 drama:{bpm:96,vol:.9,lead:pat('C6 . E6 . G5 . E6 . | D6 . C6 . A5 . . . | F5 . A5 . C6 . A5 . | G5 . E5 . G5 . . .'),bass:pat('C3 . . . G2 . . . | A2 . . . E2 . . . | F2 . . . C3 . . . | G2 . . . G2 . . .')},
 sad:{bpm:70,vol:.8,lead:pat('E5 . . D5 C5 . . . | B4 . . C5 A4 . . . | A4 . . G4 F4 . . . | E4 . . . . . . .'),bass:pat('A2 . . . . . . . | E2 . . . . . . . | F2 . . . . . . . | E2 . . . . . . .')}};
const PARTYACT={party:1,club:1,karaoke:1,festival:1,picnic:1};
function musicPick(){if(NOW-lastPick<.4&&NOW>=lastPick)return;lastPick=NOW;let n='title';
  if(screen=='secret')n='party';
  else if(screen=='drama')n=st<6?'drama':'sad';
  else if(S&&(screen=='game'||screen=='end')){const E=endId&&ENDINGS[endId];
    if(E)n=E.bad?'sad':'title';else if(phase=='act'&&PARTYACT[actName])n='party';else if(S.mood<30)n='sad';else n=phaseOf(S.hour)==3?'night':'day'}
  if(n!=curSong){curSong=n;mStep=0;mNext=0}}
function musicTick(){if(!AC||!curSong||muted)return;const so=SONGS[curSong],dt=60/so.bpm/2;
  if(mNext<AC.currentTime)mNext=AC.currentTime+.03;
  while(mNext<AC.currentTime+.2){const i=mStep%so.lead.length,l=so.lead[i],b=so.bass[i%so.bass.length];
    if(l)tone(nf(l),mNext,dt*.85,'square',.045*so.vol,0,MG);
    if(b)tone(nf(b),mNext,dt*1.7,'triangle',.09*so.vol,0,MG);
    if(so.hat&&i%2==1)noise(mNext,.03,.03,7000,7000,MG,'highpass');
    if(so.kick&&i%2==0)tone(110,mNext,.12,'sine',.18,45,MG);
    if(S&&screen=='game'&&S.weather=='rain'&&OUTDOOR[loc])noise(mNext,dt,.014,1400,1400,MG);
    mStep++;mNext+=dt}}
let last=performance.now(),frozen=false;
function step(dt){DT=paused?0:dt;if(paused)return;st+=dt;
  if(screen=='drama'){if(st>=6&&!dramaFlip){dramaFlip=true;cap(null);fx('shake');sfx('scratch');setTimeout(()=>{if(screen=='drama'){cap('…현실은 반지하','REALITY');sfx('bad');setPanel('<p class="lead">…잠깐.<br><b>현실은 반지하, 고지서, 그리고 비자.</b></p><p class="hint">이제 진짜 1년을 시작합니다.</p><button class="btn" data-a="skip">진짜 이야기 시작 ▶</button>','center')}},1100)}if(st>12&&!SHOT)go('airport')}
  if(screen=='airport'&&st>7.2&&!SHOT)go('city');
  if(screen=='campus'&&st>5&&!SHOT)go('brief');
  if(screen=='game'||screen=='end')tickGame(dt)}
function draw(){g.setTransform(1,0,0,1,0,0);
  if(screen=='title')scTitle(st);else if(screen=='drama')scDrama(st);else if(screen=='airport')scAirport(st);else if(screen=='city')scCity(st,hoverCity);
  else if(screen=='campus'||screen=='brief')scCampus(screen=='brief'?4:st,city);else if(screen=='secret')scSecret(st);else drawGame()}
function frame(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;if(!frozen){NOW=ts/1000;step(dt)}if(AC)musicPick();draw();requestAnimationFrame(frame)}
go('title');
if(SHOT){const [s,arg]=SHOT.split(':');if(s=='airport'){go('airport');st=5.4}else if(s=='city')go('city');else if(s=='brief'){city='seoul';go('brief')}else if(s=='drama'){go('drama');st=+(arg||2)}else if(s=='secret')go('secret');else if(s=='campus'){city=arg||'seoul';go('campus');st=2.2}
  else if(s=='game'||s=='ending'){city=Q.get('city')||'seoul';go('game');shotGame(s,arg)}
  const warp=+(Q.get('warp')||0),opt=Q.get('opt');let w=0,done=opt===null;
  while(w<warp){w+=1/30;NOW=w;if(!done&&w>=.9){done=true;choose(+opt)}step(1/30);draw()}
  if(Q.get('endafter')&&S){S.t=GAME;S.end=Q.get('endafter');endGame(S.end);showEnd()}
  if(warp)frozen=true}
requestAnimationFrame(frame);
